<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
BOBO 발주 검수 Dashboard V2
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<header>

<h1>
📦 BOBO 발주 검수 Dashboard V2
</h1>

<p>
삼성 온라인 발주 검수 시스템
</p>

</header>

<section class="upload-area">

<div class="upload-box">

<h2>
① 발주서
</h2>

<input
type="file"
id="purchaseFile"
accept=".xlsx,.xls">

</div>

<div class="upload-box">

<h2>
② 온라인 주문
</h2>

<input
type="file"
id="onlineFile"
accept=".xlsx,.xls">

</div>

<div class="upload-box">

<h2>
③ 직배 주문
</h2>

<input
type="file"
id="directFile"
accept=".xlsx,.xls">

</div>

</section>

<div class="button-area">

<button
id="startButton">

검수 시작

</button>

</div>

<div
id="status">

파일을 업로드하세요.

</div>

</div>

<script src="app.js"></script>

</body>

</html>
